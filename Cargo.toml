[package]
name = "claude-code-proxy"
version = "0.1.40"
description = "Anthropic-compatible proxy for Claude Code provider backends"
edition = "2024"
authors = ["Claude Code Proxy contributors"]
license = "MIT"
publish = false

[[bin]]
name = "ccp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
thiserror = "2.0"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "rustls-tls-native-roots", "blocking", "http2", "socks"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hostname = "0.4"
once_cell = "1.20"
regex-lite = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["client-proxy"] }
url = "2"
prost = "0.13"
flate2 = "1.0"
tiktoken-rs = { version = "0.12", default-features = false }
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3.14"
assert_cmd = "2"
predicates = "3"
hex = "0.4"
